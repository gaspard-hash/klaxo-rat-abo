<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Klaxo — Envoi d'un abonnement</title>
<link rel="icon" href="https://klaxo.fr/wp-content/uploads/2026/06/cropped-cropped-logo-klaxo-rond-270x270.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ---- Palette Klaxo : remplacez --klaxo-accent par le hex du site ---- */
  :root {
    --klaxo-ink:    #12161C;
    --klaxo-accent: #F5C518;
    --klaxo-paper:  #FFFFFF;
    --klaxo-muted:  #6B7280;
    --klaxo-line:   #E6E8EC;
    --klaxo-ok:     #0E7C5A;
    --klaxo-error:  #C0392B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: "Manrope", system-ui, -apple-system, sans-serif;
    color: var(--klaxo-ink);
    background: var(--klaxo-paper);
  }

  header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--klaxo-line);
  }

  header img { height: 26px; display: block; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 72px;
  }

  .panel { width: 100%; max-width: 30rem; }

  h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin: 0 0 8px;
  }

  .lede {
    margin: 0 0 36px;
    color: var(--klaxo-muted);
    font-size: 0.95rem;
    line-height: 1.6;
    max-width: 38ch;
  }

  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--klaxo-muted);
    margin-bottom: 4px;
  }

  #sellsyId {
    width: 100%;
    border: 0;
    border-bottom: 2px solid var(--klaxo-line);
    background: transparent;
    font-family: inherit;
    font-size: clamp(2.25rem, 9vw, 3.25rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--klaxo-ink);
    padding: 0 0 8px;
    border-radius: 0;
    transition: border-color 120ms ease;
  }

  #sellsyId::placeholder { color: var(--klaxo-line); }
  #sellsyId:focus { outline: none; border-bottom-color: var(--klaxo-accent); }

  button {
    margin-top: 28px;
    width: 100%;
    padding: 15px 20px;
    border: 0;
    border-radius: 10px;
    background: var(--klaxo-accent);
    color: var(--klaxo-ink);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 120ms ease;
  }

  button:hover:not(:disabled) { filter: brightness(0.94); }
  button:focus-visible { outline: 3px solid var(--klaxo-ink); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: progress; }

  #status {
    margin-top: 18px;
    font-size: 0.9rem;
    line-height: 1.5;
    min-height: 1.4em;
  }

  #status.ok    { color: var(--klaxo-ok); }
  #status.error { color: var(--klaxo-error); }

  footer {
    padding: 18px 28px;
    border-top: 1px solid var(--klaxo-line);
    font-size: 0.8rem;
    color: var(--klaxo-muted);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <img src="https://klaxo.fr/wp-content/uploads/2022/09/klaxo-logo-noir.png.webp" alt="Klaxo">
</header>

<main>
  <div class="panel">
    <h1>Envoyer un abonnement vers l'API Klaxo</h1>
    <p class="lede">Saisissez l'ID Sellsy de l'auto-école : son abonnement sera transmis à l'API Klaxo.</p>

    <label for="sellsyId">ID Sellsy</label>
    <input id="sellsyId" type="text" inputmode="numeric" autocomplete="off" placeholder="00000000" autofocus>

    <button id="send">Envoyer l'abonnement</button>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
</main>

<footer>Outil interne Klaxo</footer>

<script>
  const input  = document.getElementById('sellsyId');
  const button = document.getElementById('send');
  const status = document.getElementById('status');

  function setStatus(message, kind) {
    status.textContent = message;
    status.className = kind || '';
  }

  async function send() {
    const raw = input.value.trim();

    if (!/^\d+$/.test(raw)) {
      setStatus("L'ID Sellsy ne contient que des chiffres.", 'error');
      input.focus();
      return;
    }

    button.disabled = true;
    setStatus('Envoi en cours…');

    try {
      const response = await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sellsy_id: raw })
      });

      const data = await response.json();

      if (response.ok) {
        setStatus('Abonnement de l\'auto-école ' + raw + ' envoyé.', 'ok');
        input.value = '';
        input.focus();
      } else {
        setStatus(data.error || 'Envoi impossible.', 'error');
      }
    } catch (err) {
      setStatus('Réseau indisponible : ' + err.message, 'error');
    } finally {
      button.disabled = false;
    }
  }

  button.addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>

</body>
</html>
